# Ascend platform - production compose for all microservices.

# Shared config

x-common-env: &common-env
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}
  DB_PORT: "5432"
  JWT_SECRET: ${JWT_SECRET}
  RABBITMQ_URL: ${RABBITMQ_URL}

x-depends-infra: &depends-infra
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

# Infrastructure

services:

  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ascend_vhost
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Gateway

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      SERVICE_NAME: gateway
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      auth:
        condition: service_started
      user:
        condition: service_started
      file:
        condition: service_started
      post:
        condition: service_started
      connection:
        condition: service_started
      admin:
        condition: service_started
      notification:
        condition: service_started
    restart: unless-stopped

  # Services

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: admin
      PORT: "3007"
    depends_on:
      <<: *depends-infra
      file:
        condition: service_started
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: auth
      PORT: "3001"
      ASCEND_ADMIN_FIRST_NAME: ${ASCEND_ADMIN_FIRST_NAME}
      ASCEND_ADMIN_LAST_NAME: ${ASCEND_ADMIN_LAST_NAME}
      ASCEND_ADMIN_EMAIL: ${ASCEND_ADMIN_EMAIL}
      ASCEND_ADMIN_PASSWORD: ${ASCEND_ADMIN_PASSWORD}
      GOOGLE_CLIENT_ID_WEB: ${GOOGLE_CLIENT_ID_WEB}
      GOOGLE_CLIENT_ID_IOS: ${GOOGLE_CLIENT_ID_IOS:-}
      GOOGLE_CLIENT_ID_ANDROID: ${GOOGLE_CLIENT_ID_ANDROID:-}
    depends_on: *depends-infra
    restart: unless-stopped

  company:
    build:
      context: .
      dockerfile: services/company/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: company
      PORT: "3009"
    depends_on:
      <<: *depends-infra
      file:
        condition: service_started
      user:
        condition: service_started
    restart: unless-stopped

  connection:
    build:
      context: .
      dockerfile: services/connection/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: connection
      PORT: "3006"
    depends_on:
      <<: *depends-infra
      file:
        condition: service_started
    restart: unless-stopped

  email:
    build:
      context: .
      dockerfile: services/email/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: email
      PORT: "3069"
      ASCEND_ADMIN_FIRST_NAME: ${ASCEND_ADMIN_FIRST_NAME}
      ASCEND_ADMIN_LAST_NAME: ${ASCEND_ADMIN_LAST_NAME}
      ASCEND_ADMIN_EMAIL: ${ASCEND_ADMIN_EMAIL}
      ASCEND_ADMIN_PASSWORD: ${ASCEND_ADMIN_PASSWORD}
    depends_on: *depends-infra
    restart: unless-stopped

  file:
    build:
      context: .
      dockerfile: services/file/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: file
      PORT: "3003"
      MINIO_ENDPOINT: minio
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ascend-files
      MINIO_PORT: "9000"
      GATEWAY_ENDPOINT: ${GATEWAY_ENDPOINT}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  job:
    build:
      context: .
      dockerfile: services/job/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: job
      PORT: "3008"
    depends_on: *depends-infra
    restart: unless-stopped

  messaging:
    build:
      context: .
      dockerfile: services/messaging/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: messaging
      PORT: "3010"
    depends_on: *depends-infra
    restart: unless-stopped

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: notification
      PORT: "3004"
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
    depends_on: *depends-infra
    restart: unless-stopped

  payment:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: payment
      PORT: "3014"
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET_KEY: ${STRIPE_WEBHOOK_SECRET_KEY}
      SESSION_TOKEN_EXPIRY_MS: ${SESSION_TOKEN_EXPIRY_MS:-3600000}
      SESSION_TOKEN_EXPIRY_CHECK_INTERVAL_MS: ${SESSION_TOKEN_EXPIRY_CHECK_INTERVAL_MS:-60000}
      PAYMENT_BASE_URL: ${PAYMENT_BASE_URL:-http://localhost:3014}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
    depends_on:
      <<: *depends-infra
      user:
        condition: service_started
    restart: unless-stopped

  post:
    build:
      context: .
      dockerfile: services/post/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: post
      PORT: "3005"
    depends_on:
      <<: *depends-infra
      file:
        condition: service_started
    restart: unless-stopped

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    environment:
      <<: *common-env
      SERVICE_NAME: user
      PORT: "3002"
    depends_on:
      <<: *depends-infra
      file:
        condition: service_started
    restart: unless-stopped

# Volumes

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:

# Networks

networks:
  default:
    name: ascend-network
    driver: bridge
